name: Windows Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Check workspace with synthetic preview
        run: cargo check --workspace --features design-preview --locked
      - name: Run strict Clippy with synthetic preview
        run: cargo clippy --workspace --features design-preview --all-targets --locked -- -D warnings
      - name: Run tests with synthetic preview
        run: cargo test --workspace --features design-preview --locked
      - name: Test build manifest rejection paths
        shell: pwsh
        run: ./scripts/tests/verify-build-artifacts.tests.ps1
      - name: Build isolated Windows release variants
        shell: pwsh
        run: ./scripts/build-windows.ps1 -RunId "ci-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Verify isolated build artifacts
        shell: pwsh
        run: ./scripts/verify-build-artifacts.ps1 -ManifestPath "target/phase-1b/artifacts/ci-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json"
      - name: Verify workspace boundaries
        shell: pwsh
        run: ./scripts/verify-architecture.ps1
